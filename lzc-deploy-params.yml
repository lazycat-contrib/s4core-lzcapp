params:
  - id: root_username
    type: string
    name: "Root Username"
    description: "Root administrator username for the S4 console and IAM"
    default_value: "root"
    optional: false

  - id: root_password
    type: secret
    name: "Root Password"
    description: "Root administrator password; enables S4 IAM"
    default_value: "$random(len=24)"
    optional: false

  - id: access_key_id
    type: string
    name: "S3 Access Key ID"
    description: "Access key ID for S3 API authentication"
    default_value: "$random(len=20)"
    optional: true

  - id: secret_access_key
    type: secret
    name: "S3 Secret Access Key"
    description: "Secret access key for S3 API authentication"
    default_value: "$random(len=40)"
    optional: true

  - id: max_upload_size
    type: string
    name: "Max Upload Size"
    description: "Maximum upload size per request, for example 5GB, 100MB, or 1024KB"
    default_value: "5GB"
    optional: true

  - id: lifecycle_enabled
    type: bool
    name: "Lifecycle Worker"
    description: "Enable lifecycle policy worker"
    default_value: "true"
    optional: true

  - id: lifecycle_interval_hours
    type: string
    name: "Lifecycle Interval Hours"
    description: "Lifecycle evaluation interval in hours"
    default_value: "24"
    optional: true

  - id: lifecycle_dry_run
    type: bool
    name: "Lifecycle Dry Run"
    description: "Log lifecycle actions without deleting objects"
    default_value: "false"
    optional: true

  - id: compaction_enabled
    type: bool
    name: "Compaction Worker"
    description: "Enable volume compaction worker"
    default_value: "true"
    optional: true

  - id: compaction_interval_hours
    type: string
    name: "Compaction Interval Hours"
    description: "Compaction check interval in hours"
    default_value: "1"
    optional: true

  - id: compaction_threshold
    type: string
    name: "Compaction Threshold"
    description: "Minimum fragmentation ratio to compact, for example 0.3"
    default_value: "0.3"
    optional: true

  - id: compaction_dry_run
    type: bool
    name: "Compaction Dry Run"
    description: "Analyze compaction without rewriting data"
    default_value: "false"
    optional: true

  - id: compaction_full_time
    type: string
    name: "Compaction Full Time"
    description: "Daily full compaction time in HH:MM local time; leave empty to disable"
    default_value: "02:00"
    optional: true

  - id: multipart_upload_ttl_hours
    type: string
    name: "Multipart Upload TTL Hours"
    description: "TTL for abandoned multipart uploads in hours"
    default_value: "24"
    optional: true

  - id: multipart_cleanup_interval_hours
    type: string
    name: "Multipart Cleanup Interval Hours"
    description: "Cleanup check interval for abandoned multipart uploads in hours"
    default_value: "1"
    optional: true

  - id: metrics_enabled
    type: bool
    name: "Prometheus Metrics"
    description: "Enable Prometheus metrics endpoint"
    default_value: "true"
    optional: true

  - id: select_enabled
    type: bool
    name: "S3 Select"
    description: "Enable S3 Select SQL engine"
    default_value: "true"
    optional: true

  - id: select_max_memory
    type: string
    name: "S3 Select Max Memory"
    description: "Per-query memory limit for the SQL engine"
    default_value: "256MB"
    optional: true

  - id: select_timeout
    type: string
    name: "S3 Select Timeout"
    description: "SQL query timeout in seconds"
    default_value: "60"
    optional: true

