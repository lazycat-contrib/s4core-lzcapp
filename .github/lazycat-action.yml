version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/s4core.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: s4core
build:
  run_buildscript: false
images:
  - id: s4core
    target: service
    service: s4core
    source: s4core/s4core
    channel: custom
    sort: semver
    tag_regex: '^ce-v\d+\.\d+\.\d+(-.+)?$'
    version_regex: '^ce-v(?P<version>\d+\.\d+\.\d+)(-.+)?$'
    version_template: '{version}'
    delivery:
      mode: mirror
  - id: s4console
    target: service
    service: s4console
    source: s4core/s4console
    channel: custom
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+-alpha-\d+$'
    version_regex: '^v(?P<version>\d+\.\d+\.\d+)-alpha-\d+$'
    version_template: '{version}'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: S4
    summary: "S3-compatible object storage with deduplication, versioning, lifecycle policies, IAM, and S3 Select"
